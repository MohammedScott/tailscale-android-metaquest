name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Crucial for Tailscale dependencies

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Use stable Go instead of the .rev file
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;23.1.7779620"

      - name: Build debug APK
        # We use gradlew directly to bypass the Makefile's Go version checks
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-quest-debug
          path: "**/*.apk"
